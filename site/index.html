<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic Preis-Spikes</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14171c;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--up:#0f9d58;--down:#d93025;--warn:#b45309;--warnbg:#fef3c7}
@media (prefers-color-scheme:dark){:root{--bg:#0d1016;--card:#1a1e27;--text:#f1f3f6;--muted:#9aa3b2;--line:#2b303b;--accent:#5b8def;--up:#34d27b;--down:#ff6b6b;--warn:#fbbf24;--warnbg:#3a2e10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:40px}
header{padding:16px 16px 4px}
h1{margin:0 0 4px;font-size:1.5rem}
.sub{color:var(--muted);font-size:.9rem}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-top:12px}
.tab{flex:1;padding:12px 4px;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font-size:1rem;font-weight:600}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.periods{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.pill{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);font-size:.95rem}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:12px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:12px}
.name{font-weight:700;font-size:1.05rem}
.set{color:var(--muted);font-size:.9rem;margin-top:2px}
.pct{text-align:right;font-weight:700;font-size:1.25rem;color:var(--up);white-space:nowrap}
.pct.neg{color:var(--down)}
.abs{text-align:right;color:var(--muted);font-size:.95rem}
.prices{color:var(--muted);margin-top:8px}
.cm{margin-top:6px;font-size:.95rem}
.cm b{font-weight:700}
.cm .p{font-weight:700}
.cm .p.up{color:var(--up)}
.cm .p.down{color:var(--down)}
.warn{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:8px;background:var(--warnbg);color:var(--warn);font-size:.85rem}
.actions{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
a.btn{padding:9px 14px;border:1px solid var(--line);border-radius:10px;color:var(--text);text-decoration:none;font-size:.95rem}
.star{margin-left:auto;background:none;border:0;font-size:1.8rem;color:var(--muted);padding:0 6px;line-height:1}
.star.on{color:#f5b301}
.why{margin-top:10px}
.why summary{cursor:pointer;color:var(--accent);font-size:.95rem;font-weight:600;padding:4px 0}
.why .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.why a{padding:8px 12px;border:1px solid var(--line);border-radius:10px;color:var(--text);text-decoration:none;font-size:.9rem}
.why .hint{margin-top:6px;font-size:.8rem;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 12px;line-height:1.5}
.small{font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Magic Preis-Spikes (USA)</h1>
  <div class="sub" id="stand">Lade ...</div>
</header>
<div class="tabs">
  <button class="tab active" data-tab="nonfoil">Non-Foil</button>
  <button class="tab" data-tab="foil">Foil</button>
  <button class="tab" data-tab="watch">Beobachtet</button>
</div>
<div class="periods" id="periods">
  <button class="pill active" data-period="24h">24 Stunden</button>
  <button class="pill" data-period="7d">7 Tage</button>
</div>
<main id="list"></main>

<script>
var WL_KEY = "mtg-spike-watchlist";
var DATA = null;
var tab = "nonfoil";
var period = "24h";
var liveCache = {};

function safeGet(){try{return localStorage.getItem(WL_KEY)}catch(e){return null}}
function safeSet(v){try{localStorage.setItem(WL_KEY,v)}catch(e){}}

function loadWatch(){
  var raw = safeGet(), arr = [];
  try { arr = JSON.parse(raw || "[]"); } catch(e) { arr = []; }
  if (!Array.isArray(arr)) {
    // Falls frueher als Objekt {key: eintrag} gespeichert
    arr = Object.keys(arr || {}).map(function(k){ var e = arr[k]; if (e && !e.key) e.key = k; return e; });
  }
  return arr.filter(Boolean).map(normWatch);
}
function first(o, keys){
  for (var i=0;i<keys.length;i++){ if (o[keys[i]] !== undefined && o[keys[i]] !== null) return o[keys[i]]; }
  return null;
}
function normWatch(e){
  var foil = !!first(e, ["foil","isFoil","is_foil"]);
  var id = first(e, ["id","card_id","cardId"]);
  return {
    id: id,
    foil: foil,
    name: e.name || "?",
    set: e.set || "",
    url: e.url || null,
    cardmarket_url: e.cardmarket_url || e.cardmarketUrl || null,
    price_at_mark: first(e, ["price_at_mark","priceAtMark","mark_price","markPrice","start_price","startPrice","price"]),
    eur_at_mark: first(e, ["eur_at_mark","eurAtMark"]),
    marked_at: first(e, ["marked_at","markedAt","date","added","addedAt"])
  };
}
function saveWatch(list){ safeSet(JSON.stringify(list)); }
function wKey(id, foil){ return id + (foil ? "|f" : "|n"); }
function isWatched(id, foil){
  return loadWatch().some(function(w){ return w.id === id && w.foil === foil; });
}
function toggleWatch(s, foil){
  var list = loadWatch();
  var idx = -1;
  for (var i=0;i<list.length;i++){ if (list[i].id === s.id && list[i].foil === foil) idx = i; }
  if (idx >= 0) { list.splice(idx,1); }
  else {
    list.push({
      id: s.id, foil: foil, name: s.name, set: s.set, url: s.url,
      cardmarket_url: s.cardmarket_url,
      price_at_mark: s.price_today,
      eur_at_mark: (s.eur_price_today !== undefined ? s.eur_price_today : null),
      marked_at: new Date().toISOString()
    });
  }
  saveWatch(list);
  render();
}

function usd(v){ return v === null || v === undefined ? "-" : "$" + Number(v).toFixed(2); }
function eur(v){ return v === null || v === undefined ? "-" : "€" + Number(v).toFixed(2).replace(".", ","); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function pctTxt(p){ return (p >= 0 ? "+" : "") + p.toFixed(1).replace(".", ",") + "%"; }
function fmtDate(iso){
  if (!iso) return "";
  var d = new Date(iso); if (isNaN(d)) return String(iso);
  return d.getDate() + "." + (d.getMonth()+1) + "." + d.getFullYear();
}

// Cardmarket-Zeile: Preis in EUR + Veraenderung in % (wenn Vergleich vorhanden)
function eurTrendHtml(today, pct){
  if (today === null || today === undefined) {
    return '<div class="cm"><b>Cardmarket:</b> <span class="small">kein Preis</span></div>';
  }
  var pctPart = "";
  if (pct !== null && pct !== undefined) {
    pctPart = ' <span class="p ' + (pct >= 0 ? "up" : "down") + '">' + (pct >= 0 ? "▲ " : "▼ ") + pctTxt(pct) + '</span>';
  } else {
    pctPart = ' <span class="small">(Vergleich folgt)</span>';
  }
  return '<div class="cm"><b>Cardmarket:</b> ' + eur(today) + pctPart + '</div>';
}

// Warnung wenn US-Preis viel hoeher als CM-Preis (typisch fuer Daten-Ausreisser)
function outlierHtml(usdPrice, eurPrice){
  if (eurPrice && usdPrice && usdPrice / eurPrice > 2) {
    return '<div class="warn">⚠ US-Preis weicht stark vom Cardmarket-Preis ab - evtl. Ausreisser</div>';
  }
  return "";
}


// "Warum gefragt?" - Suchlinks zu Artikeln/Infos (Zeitraum: days = 7 oder 30)
function slugEdhrec(name){
  return String(name).split("//")[0].toLowerCase().replace(/['\u2019,"]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}
function whyHtml(name, days){
  var front = String(name).split("//")[0].trim();
  var q = encodeURIComponent('"' + front + '" mtg');
  var gTime = days >= 30 ? "qdr:m" : "qdr:w";
  var rTime = days >= 30 ? "month" : "week";
  var label = days >= 30 ? "30 Tage" : "7 Tage";
  return '<details class="why"><summary>Warum gefragt?</summary><div class="links">' +
    '<a target="_blank" rel="noopener" href="https://www.google.com/search?q=' + q + '&tbm=nws&tbs=' + gTime + '">News (' + label + ')</a>' +
    '<a target="_blank" rel="noopener" href="https://www.reddit.com/search/?q=' + q + '&sort=new&t=' + rTime + '">Reddit (' + label + ')</a>' +
    '<a target="_blank" rel="noopener" href="https://edhrec.com/cards/' + slugEdhrec(name) + '">EDHREC</a>' +
    '<a target="_blank" rel="noopener" href="https://www.mtggoldfish.com/q?query_string=' + encodeURIComponent(front) + '">MTGGoldfish</a>' +
    '</div><div class="hint">Suchlinks: bei seltenen Namen evtl. keine Treffer.</div></details>';
}

function cardHtml(s, foil){
  var on = isWatched(s.id, foil);
  var cm = s.cardmarket_url ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(s.cardmarket_url) + '">Cardmarket</a>' : "";
  var sf = s.url ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(s.url) + '">Scryfall</a>' : "";
  return '<div class="card">' +
    '<div class="row"><div><div class="name">' + esc(s.name) + '</div><div class="set">' + esc(s.set) + '</div></div>' +
    '<div><div class="pct">▲ ' + s.change_pct.toFixed(1) + '%</div><div class="abs">+$' + s.change_abs.toFixed(2) + '</div></div></div>' +
    '<div class="prices">' + usd(s.price_yesterday) + ' → ' + usd(s.price_today) + '</div>' +
    eurTrendHtml(s.eur_price_today, s.eur_change_pct) +
    outlierHtml(s.price_today, s.eur_price_today) +
    whyHtml(s.name, period === "7d" ? 30 : 7) +
    '<div class="actions">' + sf + cm +
    '<button class="star' + (on ? " on" : "") + '" data-star="' + esc(s.id) + '" aria-label="Beobachten">' + (on ? "★" : "☆") + '</button></div></div>';
}

function watchCardHtml(w){
  var live = liveCache[wKey(w.id, w.foil)];
  var nowUsd = live ? live.usd : null;
  var nowEur = live ? live.eur : null;
  var head = "", pctBlock = "";
  if (nowUsd !== null && nowUsd !== undefined && w.price_at_mark) {
    var p = (nowUsd - w.price_at_mark) / w.price_at_mark * 100;
    pctBlock = '<div class="pct ' + (p < 0 ? "neg" : "") + '">' + (p < 0 ? "▼ " : "▲ ") + Math.abs(p).toFixed(1) + '%</div><div class="abs">jetzt ' + usd(nowUsd) + '</div>';
  } else {
    pctBlock = '<div class="abs">' + (live ? "kein Preis" : "lädt ...") + '</div>';
  }
  var eurLine = "";
  if (live) {
    var ep = null;
    if (w.eur_at_mark && nowEur) ep = (nowEur - w.eur_at_mark) / w.eur_at_mark * 100;
    var base = w.eur_at_mark ? ' <span class="small">(beim Markieren ' + eur(w.eur_at_mark) + ')</span>' : "";
    eurLine = '<div class="cm"><b>Cardmarket jetzt:</b> ' + eur(nowEur) +
      (ep !== null ? ' <span class="p ' + (ep >= 0 ? "up" : "down") + '">' + (ep >= 0 ? "▲ " : "▼ ") + pctTxt(ep) + '</span>' : '') + base + '</div>';
  }
  var cm = w.cardmarket_url ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(w.cardmarket_url) + '">Cardmarket</a>' : "";
  var sf = w.url ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(w.url) + '">Scryfall</a>' : "";
  return '<div class="card">' +
    '<div class="row"><div><div class="name">' + esc(w.name) + '</div><div class="set">' + esc(w.set) + (w.foil ? " (Foil)" : "") + '</div></div><div>' + pctBlock + '</div></div>' +
    '<div class="prices">Preis beim Markieren: ' + usd(w.price_at_mark) + '</div>' +
    '<div class="small" style="margin-top:2px">Beobachtet seit ' + esc(fmtDate(w.marked_at)) + '</div>' +
    eurLine +
    (live ? outlierHtml(nowUsd, nowEur) : "") +
    whyHtml(w.name, 30) +
    '<div class="actions">' + sf + cm +
    '<button class="star on" data-unstar="' + esc(w.id) + '" data-foil="' + (w.foil ? "1" : "0") + '" aria-label="Nicht mehr beobachten">★</button></div></div>';
}

function fetchLive(w){
  var k = wKey(w.id, w.foil);
  if (liveCache[k] !== undefined || !w.id) return;
  liveCache[k] = null;
  fetch("https://api.scryfall.com/cards/" + encodeURIComponent(w.id))
    .then(function(r){ return r.json(); })
    .then(function(c){
      var p = c.prices || {};
      var u = w.foil ? p.usd_foil : p.usd;
      var e = w.foil ? p.eur_foil : p.eur;
      liveCache[k] = { usd: u ? parseFloat(u) : null, eur: e ? parseFloat(e) : null };
      if (tab === "watch") render();
    })
    .catch(function(){ liveCache[k] = { usd: null, eur: null }; if (tab === "watch") render(); });
}

function render(){
  var el = document.getElementById("list");
  document.getElementById("periods").style.display = tab === "watch" ? "none" : "flex";
  if (!DATA) { el.innerHTML = '<div class="empty">Lade Daten ...</div>'; return; }

  if (tab === "watch") {
    var wl = loadWatch();
    if (!wl.length) {
      el.innerHTML = '<div class="empty">Noch keine Karten markiert.<br>Tippe bei einer Karte auf den Stern, um sie zu beobachten.</div>';
      return;
    }
    wl.forEach(fetchLive);
    el.innerHTML = wl.map(watchCardHtml).join("");
    return;
  }

  var foil = tab === "foil";
  var list;
  if (period === "7d") {
    if (!DATA.has_7d_comparison) {
      el.innerHTML = '<div class="empty">Der 7-Tage-Vergleich braucht mindestens 5 Tage gespeicherten Verlauf.<br>Er erscheint automatisch, sobald genug Tage vorhanden sind.</div>';
      return;
    }
    list = foil ? DATA.spikes_foil_7d : DATA.spikes_nonfoil_7d;
  } else {
    if (!DATA.compared_to_previous_run) {
      el.innerHTML = '<div class="empty">Noch kein Vergleichstag vorhanden.<br>Ab dem nächsten Lauf erscheinen hier Spikes.</div>';
      return;
    }
    list = foil ? DATA.spikes_foil : DATA.spikes_nonfoil;
  }
  if (!list || !list.length) {
    el.innerHTML = '<div class="empty">Aktuell keine Spikes, die die Filter erfüllen.</div>';
    return;
  }
  el.innerHTML = list.map(function(s){ return cardHtml(s, foil); }).join("");
}

document.addEventListener("click", function(ev){
  var t = ev.target;
  if (t.classList.contains("tab")) {
    tab = t.getAttribute("data-tab");
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){ b.classList.toggle("active", b === t); });
    render(); return;
  }
  if (t.classList.contains("pill")) {
    period = t.getAttribute("data-period");
    Array.prototype.forEach.call(document.querySelectorAll(".pill"), function(b){ b.classList.toggle("active", b === t); });
    render(); return;
  }
  if (t.hasAttribute("data-star")) {
    var id = t.getAttribute("data-star");
    var foil = tab === "foil";
    var src = period === "7d" ? (foil ? DATA.spikes_foil_7d : DATA.spikes_nonfoil_7d) : (foil ? DATA.spikes_foil : DATA.spikes_nonfoil);
    var s = (src || []).filter(function(x){ return x.id === id; })[0];
    if (s) toggleWatch(s, foil);
    return;
  }
  if (t.hasAttribute("data-unstar")) {
    var uid = t.getAttribute("data-unstar");
    var uf = t.getAttribute("data-foil") === "1";
    saveWatch(loadWatch().filter(function(w){ return !(w.id === uid && w.foil === uf); }));
    render();
  }
});

fetch("./data.json?t=" + Date.now(), { cache: "no-store" })
  .then(function(r){ return r.json(); })
  .then(function(d){
    DATA = d;
    var dt = new Date(d.generated_at);
    var total = (d.card_count_nonfoil || 0) + (d.card_count_foil || 0);
    document.getElementById("stand").textContent =
      "Stand: " + dt.toLocaleString("de-AT") + " - " + total + " Preise geprüft";
    render();
  })
  .catch(function(){
    document.getElementById("stand").textContent = "Daten konnten nicht geladen werden.";
  });
</script>
</body>
</html>
