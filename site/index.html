<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MTG Preis-Spikes (USA)</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --text:#eef0f3; --muted:#9aa1ac;
    --up:#3ddc84; --down:#ff5c5c; --border:#2a2e37; --accent:#5b8cff; --star:#f5c518;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f6f7f9; --card:#ffffff; --text:#1c1f26; --muted:#6b7280;
      --up:#1a9850; --down:#d6334c; --border:#e5e7eb; --accent:#2f5fdb; --star:#b8860b;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  header{
    padding:20px 16px 0; position:sticky; top:0;
    padding-top:calc(16px + env(safe-area-inset-top,0px));
    background:var(--bg); border-bottom:1px solid var(--border); z-index:10;
  }
  h1{font-size:1.3rem; margin:0 0 4px}
  #meta{color:var(--muted); font-size:0.85rem; margin-bottom:12px}
  .tabs{display:flex; gap:4px}
  .tab{
    flex:1; text-align:center; padding:10px; cursor:pointer;
    color:var(--muted); font-weight:600; font-size:0.85rem;
    border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--accent); border-bottom-color:var(--accent)}
  .period-row{display:flex; gap:8px; padding:10px 0 2px}
  .period-btn{
    padding:6px 14px; border-radius:999px; border:1px solid var(--border);
    background:transparent; color:var(--muted); font-size:0.8rem; cursor:pointer;
  }
  .period-btn.active{background:var(--accent); border-color:var(--accent); color:#fff}
  main{padding:12px 16px 40px; max-width:680px; margin:0 auto}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:14px; margin-bottom:10px;
  }
  .card-top{display:flex; justify-content:space-between; gap:10px}
  .name{font-weight:600; font-size:1rem}
  .set{color:var(--muted); font-size:0.8rem; margin-top:2px}
  .prices{color:var(--muted); font-size:0.85rem; margin-top:6px}
  .change{text-align:right; white-space:nowrap; font-weight:700; font-size:1.1rem}
  .change.up{color:var(--up)}
  .change.down{color:var(--down)}
  .abs{font-size:0.8rem; font-weight:400; color:var(--muted)}
  .card-actions{display:flex; align-items:center; gap:10px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border)}
  .link-btn{
    font-size:0.8rem; padding:6px 10px; border-radius:8px; border:1px solid var(--border);
    color:var(--text); text-decoration:none; background:transparent;
  }
  .star-btn{
    margin-left:auto; background:none; border:none; font-size:1.3rem; cursor:pointer;
    color:var(--muted); line-height:1; padding:4px;
  }
  .star-btn.active{color:var(--star)}
  #empty{color:var(--muted); text-align:center; padding:40px 16px}
  .watch-date{color:var(--muted); font-size:0.75rem; margin-top:4px}
</style>
</head>
<body>
<header>
  <h1>Magic Preis-Spikes (USA)</h1>
  <div id="meta">Lade...</div>
  <div class="tabs">
    <div class="tab active" data-finish="nonfoil">Non-Foil</div>
    <div class="tab" data-finish="foil">Foil</div>
    <div class="tab" data-finish="watched">Beobachtet</div>
  </div>
  <div class="period-row" id="periodRow">
    <button class="period-btn active" data-period="24h">24 Stunden</button>
    <button class="period-btn" data-period="7d">7 Tage</button>
  </div>
</header>
<main id="list"></main>

<script>
const WATCHLIST_KEY = 'mtg-spike-watchlist';
let DATA = null;
let currentFinish = 'nonfoil';
let currentPeriod = '24h';

function getWatchlist(){
  try{ return JSON.parse(localStorage.getItem(WATCHLIST_KEY)) || []; }
  catch(e){ return []; }
}
function saveWatchlist(list){
  try{ localStorage.setItem(WATCHLIST_KEY, JSON.stringify(list)); }
  catch(e){ /* ignore */ }
}
function isWatched(id, finish){
  return getWatchlist().some(w => w.id === id && w.finish === finish);
}
function toggleWatch(spike, finish){
  let list = getWatchlist();
  const idx = list.findIndex(w => w.id === spike.id && w.finish === finish);
  if(idx >= 0){
    list.splice(idx, 1);
  }else{
    list.push({
      id: spike.id, finish: finish, name: spike.name, set: spike.set,
      url: spike.url, cardmarket_url: spike.cardmarket_url,
      price_when_marked: spike.price_today, marked_at: new Date().toISOString()
    });
  }
  saveWatchlist(list);
  render();
}

function linksHtml(url, cardmarket_url){
  let html = '';
  if(url) html += `<a class="link-btn" href="${url}" target="_blank" rel="noopener">Scryfall</a>`;
  if(cardmarket_url) html += `<a class="link-btn" href="${cardmarket_url}" target="_blank" rel="noopener">Cardmarket</a>`;
  return html;
}

function spikeCardHtml(s, finish){
  const dir = s.change_pct >= 0 ? 'up' : 'down';
  const arrow = s.change_pct >= 0 ? '&#9650;' : '&#9660;';
  const watched = isWatched(s.id, finish);
  return `<div class="card">
    <div class="card-top">
      <div>
        <div class="name">${s.name}</div>
        <div class="set">${s.set}</div>
        <div class="prices">$${s.price_yesterday.toFixed(2)} &rarr; $${s.price_today.toFixed(2)}</div>
      </div>
      <div class="change ${dir}">${arrow} ${Math.abs(s.change_pct).toFixed(1)}%
        <div class="abs">${s.change_abs >= 0 ? '+' : ''}$${s.change_abs.toFixed(2)}</div>
      </div>
    </div>
    <div class="card-actions">
      ${linksHtml(s.url, s.cardmarket_url)}
      <button class="star-btn ${watched ? 'active' : ''}" data-id="${s.id}" data-finish="${finish}" title="Beobachten">${watched ? '&#9733;' : '&#9734;'}</button>
    </div>
  </div>`;
}

async function fetchLivePrice(id, finish){
  try{
    const res = await fetch(`https://api.scryfall.com/cards/${id}`);
    if(!res.ok) return null;
    const card = await res.json();
    const p = finish === 'foil' ? card.prices.usd_foil : card.prices.usd;
    return p ? parseFloat(p) : null;
  }catch(e){
    return null;
  }
}

async function renderWatched(){
  const list = document.getElementById('list');
  const watchlist = getWatchlist();
  if(!watchlist.length){
    list.innerHTML = '<div id="empty">Noch keine Karten markiert. Tippe auf den Stern bei einer Karte, um sie hier zu beobachten.</div>';
    return;
  }
  list.innerHTML = watchlist.map(w => `<div class="card" id="watch-${w.id}-${w.finish}">
    <div class="card-top">
      <div>
        <div class="name">${w.name}</div>
        <div class="set">${w.set} ${w.finish === 'foil' ? '(Foil)' : ''}</div>
        <div class="prices">Preis beim Markieren: $${w.price_when_marked.toFixed(2)}</div>
        <div class="watch-date">Beobachtet seit ${new Date(w.marked_at).toLocaleDateString('de-DE')}</div>
      </div>
      <div class="change" id="live-${w.id}-${w.finish}">&hellip;</div>
    </div>
    <div class="card-actions">
      ${linksHtml(w.url, w.cardmarket_url)}
      <button class="star-btn active" data-id="${w.id}" data-finish="${w.finish}" title="Entmarkieren">&#9733;</button>
    </div>
  </div>`).join('');

  attachStarHandlers();

  for(const w of watchlist){
    const price = await fetchLivePrice(w.id, w.finish);
    const el = document.getElementById(`live-${w.id}-${w.finish}`);
    if(!el) continue;
    if(price === null){
      el.innerHTML = '<span style="color:var(--muted); font-size:0.85rem">nicht verfügbar</span>';
      continue;
    }
    const diff = price - w.price_when_marked;
    const pct = w.price_when_marked > 0 ? (diff / w.price_when_marked) * 100 : 0;
    const dir = diff >= 0 ? 'up' : 'down';
    const arrow = diff >= 0 ? '&#9650;' : '&#9660;';
    el.className = `change ${dir}`;
    el.innerHTML = `${arrow} ${Math.abs(pct).toFixed(1)}%
      <div class="abs">jetzt $${price.toFixed(2)}</div>`;
  }
}

function attachStarHandlers(){
  document.querySelectorAll('.star-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const finish = btn.dataset.finish;
      if(currentFinish === 'watched'){
        let list = getWatchlist().filter(w => !(w.id === id && w.finish === finish));
        saveWatchlist(list);
        render();
        return;
      }
      const spikes = finish === 'foil' ? DATA.spikes_foil : DATA.spikes_nonfoil;
      const spike = spikes.find(s => s.id === id);
      if(spike) toggleWatch(spike, finish);
    });
  });
}

function render(){
  const list = document.getElementById('list');
  const periodRow = document.getElementById('periodRow');
  periodRow.style.display = currentFinish === 'watched' ? 'none' : 'flex';

  if(currentFinish === 'watched'){
    renderWatched();
    return;
  }
  if(!DATA){ return; }

  if(currentPeriod === '7d'){
    if(!DATA.has_7d_comparison){
      list.innerHTML = '<div id="empty">Noch nicht genug Preis-Historie fuer den 7-Tage-Vergleich. Das baut sich in den ersten Tagen automatisch auf.</div>';
      return;
    }
    const spikes7d = currentFinish === 'foil' ? DATA.spikes_foil_7d : DATA.spikes_nonfoil_7d;
    if(!spikes7d || !spikes7d.length){
      list.innerHTML = '<div id="empty">Aktuell keine Karten mit mindestens 35% Anstieg in den letzten 7 Tagen.</div>';
      return;
    }
    list.innerHTML = spikes7d.map(s => spikeCardHtml(s, currentFinish)).join('');
    attachStarHandlers();
    return;
  }

  if(!DATA.compared_to_previous_run){
    list.innerHTML = '<div id="empty">Erster Durchlauf - noch kein Vergleichswert von gestern. Morgen gibt es die ersten Spikes.</div>';
    return;
  }

  const spikes = currentFinish === 'foil' ? DATA.spikes_foil : DATA.spikes_nonfoil;
  if(!spikes || !spikes.length){
    list.innerHTML = '<div id="empty">Aktuell keine Spikes ueber $3 mit mindestens 20% Anstieg.</div>';
    return;
  }

  list.innerHTML = spikes.map(s => spikeCardHtml(s, currentFinish)).join('');
  attachStarHandlers();
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFinish = tab.dataset.finish;
    render();
  });
});

document.querySelectorAll('.period-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = btn.dataset.period;
    render();
  });
});

async function load(){
  const meta = document.getElementById('meta');
  try{
    const res = await fetch('./data.json?_=' + Date.now());
    if(!res.ok) throw new Error('data.json nicht gefunden');
    DATA = await res.json();

    const generated = new Date(DATA.generated_at);
    const count = (DATA.card_count_nonfoil || 0) + (DATA.card_count_foil || 0);
    meta.textContent = `Stand: ${generated.toLocaleString('de-DE')} - ${count} Preise geprueft`;
    render();
  }catch(err){
    meta.textContent = 'Fehler beim Laden der Daten.';
    console.error(err);
  }
}
load();
</script>
</body>
</html>
