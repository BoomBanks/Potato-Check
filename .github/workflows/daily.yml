name: Daily MTG Price Spike Check

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-spikes:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Spikes berechnen
        run: python scripts/fetch_spikes.py

      - name: Ergebnisse committen & pushen
        run: |
          git config user.name "mtg-spike-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json site/data.json
          [ -f data/previous.json ] && git add data/previous.json || true
          [ -d data/history ] && git add -A data/history || true
          git diff --quiet --cached || git commit -m "Tägliches Preis-Update: $(date -u +'%Y-%m-%d')"
          git push

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: Seite als Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
